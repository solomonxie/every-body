<!doctype html><html><body style="margin:0">
<canvas id="c" width="360" height="360"></canvas>
<script type="module">
// Renders one Explore tile from the schematic body: #system=<id>&layers=a,b&y=<focus>&d=<distance>&skin=<opacity>&color=<hex>
import * as THREE from './three.module.js';
import { SCHEMATIC_PARTS } from './data/body/index.js';
import { BODY_PARTS, ORGANS } from './data/anatomy.js';
const q = new URLSearchParams(location.hash.slice(1));
const layers = (q.get('layers') || '').split(',');
const UP = new THREE.Vector3(0, 1, 0);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setClearColor(q.get('bg') || '#EEF0F4');
const sc = new THREE.Scene();
sc.add(new THREE.AmbientLight(0xffffff, 0.8));
const d1 = new THREE.DirectionalLight(0xffffff, 1.1); d1.position.set(3, 4, 5); sc.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.4); d2.position.set(-3, 2, -4); sc.add(d2);
for (const p of SCHEMATIC_PARTS) {
  if (!layers.includes(p.layer)) continue;
  const s = p.shape; const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.55 });
  let m;
  if (s.kind === 'sphere') { m = new THREE.Mesh(new THREE.SphereGeometry(s.radius, 24, 18), mat); m.position.set(...s.center); if (s.scale) m.scale.set(...s.scale); }
  else if (s.kind === 'box') { m = new THREE.Mesh(new THREE.BoxGeometry(...s.size), mat); m.position.set(...s.center); if (s.rotation) m.rotation.set(...s.rotation); }
  else if (s.kind === 'segment' || s.kind === 'spindle') {
    const a = new THREE.Vector3(...s.from), b = new THREE.Vector3(...s.to), dir = b.clone().sub(a), L = dir.length();
    m = s.kind === 'segment' ? new THREE.Mesh(new THREE.CapsuleGeometry(s.radius, L, 4, 10), mat) : new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), mat);
    if (s.kind === 'spindle') m.scale.set(s.radius, L / 2, s.radius * 0.8);
    m.position.copy(a.clone().add(b).multiplyScalar(0.5)); m.quaternion.setFromUnitVectors(UP, dir.normalize());
  } else if (s.kind === 'tube') { m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(s.points.map((p) => new THREE.Vector3(...p))), 40, s.radius * 1.4, 8, false), mat); }
  else { m = new THREE.Mesh(new THREE.TorusGeometry(s.radius, s.tube, 6, 36, s.sweep), mat); m.position.set(...s.center); m.rotation.set(Math.PI / 2, 0, s.start); m.scale.set(1, s.depth, 1); }
  sc.add(m);
}
if (layers.includes('organs')) for (const o of Object.values(ORGANS)) {
  if (o.region) continue;
  const m = new THREE.Mesh(new THREE.SphereGeometry(o.radius, 20, 20), new THREE.MeshStandardMaterial({ color: o.color })); m.position.set(...o.position); if (o.scale) m.scale.set(...o.scale); sc.add(m);
}
const skin = Number(q.get('skin') || 0);
if (skin > 0) for (const b of BODY_PARTS) {
  const s = b.shape; const g = s.kind === 'sphere' ? new THREE.SphereGeometry(s.radius, 24, 24) : s.kind === 'capsule' ? new THREE.CapsuleGeometry(s.radius, s.length, 8, 16) : new THREE.BoxGeometry(...s.size);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: q.get('color') || '#F2C9A5', transparent: true, opacity: skin, depthWrite: false }));
  m.position.set(...b.position); m.rotation.z = b.rotationZ ?? 0; if (b.scale) m.scale.set(...b.scale); sc.add(m);
}
const y = Number(q.get('y') || 0), dist = Number(q.get('d') || 5.8);
const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 50); cam.position.set(0.9, y + 0.3, dist); cam.lookAt(0, y, 0);
renderer.render(sc, cam);
document.title = 'done';
</script></body></html>
