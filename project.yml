name: EveryBody
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

targets:
  EveryBody:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/README.md"
      - path: Resources
        excludes:
          - "**/README.md"
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Every Body
        CFBundleName: Every Body
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        AppStoreRegion: $(STORE)
        # everybody://viewer/skeletal — opens a screen directly (also used for device screenshots)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [everybody]
    settings:
      base:
        # Real bundle id and team come from the gitignored .env.local via scripts/install-ios-device.sh.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.everybody
        # App Store region (us = Canada/US, cn); `make device STORE=cn`.
        STORE: us
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
